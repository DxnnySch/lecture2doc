[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture2doc"
version = "0.1.0"
description = "Turn a lecture video and its slides into a Word document with a transcript per slide"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
lecture2doc = "lecture2doc.cli:main"

[tool.setuptools]
packages = ["lecture2doc"]

[tool.setuptools.package-data]
lecture2doc = ["ui_static/*.html"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
